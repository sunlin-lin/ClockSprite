name: Publish ClockSprite release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clocksprite-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check release version
        shell: bash
        run: |
          version=$(python3 -c 'import plistlib; print(plistlib.load(open("Info.plist", "rb"))["CFBundleShortVersionString"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Info.plist version $version" >&2
            exit 1
          fi
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
      - name: Test
        run: go test model.go storage.go reminders.go calendar_picker.go appearance.go mascot_animation.go model_linux_test.go storage_linux_test.go mascot_animation_test.go
      - name: Build and package
        env:
          CGO_ENABLED: '0'
        run: |
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags '-H=windowsgui -s -w' -o ClockSprite.exe .
          GOOS=darwin GOARCH=amd64 go build -trimpath -o Unified-amd64 .
          GOOS=darwin GOARCH=arm64 go build -trimpath -o Unified-arm64 .
          python3 package.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi
          gh release create "$RELEASE_TAG" ClockSprite.zip ClockSprite-macOS.zip \
            --target "$GITHUB_SHA" --title "ClockSprite $RELEASE_TAG" --generate-notes
